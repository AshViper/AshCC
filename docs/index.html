<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AshCC Lua API</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --panel-2: #fafaf8; --text: #1d1f23; --muted: #5d6470; --line: #e3e4e8; --line-strong: #cfd2d8;
  --accent: #b5481f; --accent-soft: #fbeee8; --code-bg: #f1f2f4; --tag: #2f6f4f; --tag-bg: #e6f2eb;
  --warn: #8a5a00; --warn-bg: #fff4dc; --info: #2d5b9a; --info-bg: #e8f0fb;
  --syn-kw: #a1356b; --syn-str: #2f7a3f; --syn-num: #a35a00; --syn-com: #8a8f98; --syn-fn: #2d5b9a;
  --mark: #ffe08a; --shadow: 0 1px 2px rgba(20, 22, 26, .04), 0 4px 14px rgba(20, 22, 26, .04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131518; --panel: #1b1e22; --panel-2: #202429; --text: #e6e7ea; --muted: #9aa1ac; --line: #2b2f35; --line-strong: #3b4048;
    --accent: #ff8a5c; --accent-soft: #3a241b; --code-bg: #23272d; --tag: #7fd1a3; --tag-bg: #1d3328;
    --warn: #f3c66b; --warn-bg: #3a2f17; --info: #8db8f2; --info-bg: #1c2a3d;
    --syn-kw: #f08fbf; --syn-str: #9bd68f; --syn-num: #f3b26b; --syn-com: #7d848f; --syn-fn: #8db8f2;
    --mark: #6b5418; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #131518; --panel: #1b1e22; --panel-2: #202429; --text: #e6e7ea; --muted: #9aa1ac; --line: #2b2f35; --line-strong: #3b4048;
  --accent: #ff8a5c; --accent-soft: #3a241b; --code-bg: #23272d; --tag: #7fd1a3; --tag-bg: #1d3328;
  --warn: #f3c66b; --warn-bg: #3a2f17; --info: #8db8f2; --info-bg: #1c2a3d;
  --syn-kw: #f08fbf; --syn-str: #9bd68f; --syn-num: #f3b26b; --syn-com: #7d848f; --syn-fn: #8db8f2;
  --mark: #6b5418; --shadow: none;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 76px; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.75 "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
}
code, pre, kbd, .mono { font-family: "Cascadia Mono", "Consolas", "Menlo", monospace; font-size: 13.5px; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
pre { background: var(--code-bg); padding: 14px 16px; border-radius: 10px; overflow-x: auto; line-height: 1.6; margin: 0; }
pre code { background: none; padding: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
mark { background: var(--mark); color: inherit; padding: 0 1px; border-radius: 2px; }
.hidden { display: none !important; }

/* 骨組み */
.layout { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
aside {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--panel); padding: 20px 12px 40px;
}
.brand { display: block; font-weight: 700; font-size: 19px; color: var(--text); padding: 0 10px; }
.brand:hover { text-decoration: none; }
.brand span { color: var(--accent); }
.brand em { font-style: normal; font-weight: 600; font-size: 15px; color: var(--muted); margin-left: 2px; }
.sub { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 4px 10px 8px; }
nav .group { color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .06em; margin: 18px 10px 4px; }
nav a {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  padding: 5px 10px; border-radius: 7px; color: var(--text); font-size: 14px; line-height: 1.5;
}
nav a:hover { background: var(--panel-2); text-decoration: none; }
nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav a small { color: var(--muted); font-family: "Cascadia Mono", "Consolas", monospace; font-size: 11px; font-weight: 400; white-space: nowrap; }
.backdrop, .topbar .menu { display: none; }

main { min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: 10px 32px; border-bottom: 1px solid var(--line);
  background: var(--bg); background: color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.searchbox { position: relative; flex: 1; max-width: 560px; }
.searchbox svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
#search {
  width: 100%; padding: 8px 40px 8px 36px; border: 1px solid var(--line-strong); border-radius: 9px;
  background: var(--panel); color: var(--text); font: inherit; font-size: 14px; outline: none;
}
#search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.searchbox kbd {
  position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: 11.5px; color: var(--muted);
  border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; line-height: 1.5; background: var(--bg);
}
.count { color: var(--muted); font-size: 13px; white-space: nowrap; }
.iconbtn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; min-width: 36px; padding: 0 10px;
  border: 1px solid var(--line-strong); border-radius: 9px; background: var(--panel); cursor: pointer; font-size: 13px; color: var(--text);
}
.iconbtn:hover { border-color: var(--accent); color: var(--accent); }
.topbar .spacer { flex: 1; }

.page { padding: 32px 32px 96px; max-width: 1120px; }
h1 { font-size: 30px; line-height: 1.3; margin: 0 0 8px; }
.lead { color: var(--muted); margin: 0 0 14px; max-width: 760px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.legend kbd { font-size: 11.5px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; line-height: 1.5; background: var(--panel); }

/* 一覧カード */
.ov-group > h2 { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .06em; margin: 26px 0 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.card {
  display: flex; flex-direction: column; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; color: var(--text); box-shadow: var(--shadow); transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); text-decoration: none; transform: translateY(-1px); }
.card .t { font-weight: 600; }
.card .m { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.card .m code { background: none; padding: 0; font-size: 12px; min-width: 0; overflow-wrap: anywhere; }
.card .m > span { white-space: nowrap; }
.card .badges { margin: 6px 0 0; }
.card .badge { white-space: normal; }
#content { margin-top: 36px; }

/* 周辺機器の節 */
section.per {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin: 0 0 26px;
  box-shadow: var(--shadow); overflow: hidden;
}
.per-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.eyebrow { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .05em; }
.per-head h2 { margin: 2px 0 0; font-size: 23px; line-height: 1.35; }
.per-head h2 a { color: inherit; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.badge { font-size: 12px; line-height: 1.7; padding: 0 9px; border-radius: 999px; background: var(--tag-bg); color: var(--tag); white-space: nowrap; }
.badge.req { background: var(--warn-bg); color: var(--warn); }
.badge.id { background: var(--code-bg); color: var(--muted); font-family: "Cascadia Mono", "Consolas", monospace; }
.head-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
.snippet {
  display: inline-flex; align-items: center; gap: 10px; max-width: 100%; padding: 4px 6px 4px 12px; cursor: pointer;
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; text-align: left;
}
.snippet code { background: none; padding: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.snippet .hint { font-size: 11.5px; color: var(--muted); border-left: 1px solid var(--line-strong); padding: 0 6px 0 10px; white-space: nowrap; }
.snippet:hover { border-color: var(--accent); }
.subnav { display: flex; flex-wrap: wrap; gap: 6px; }
.subnav a {
  font-size: 12.5px; line-height: 1.8; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px;
  color: var(--muted); background: var(--panel);
}
.subnav a:hover { color: var(--accent); border-color: var(--accent); text-decoration: none; }

.per-body { padding: 4px 24px 24px; }
h3 {
  display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--muted);
  letter-spacing: .05em; margin: 22px 0 10px;
}
h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
h3 .n { font-weight: 400; }
ul.notes { margin: 14px 0 0; padding-left: 20px; }
ul.notes li { margin: 3px 0; }
ul.notes li::marker { color: var(--accent); }

.fns { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.fn {
  position: relative; display: grid; grid-template-columns: minmax(230px, 40%) minmax(0, 1fr); gap: 4px 20px;
  padding: 10px 16px; border-top: 1px solid var(--line); scroll-margin-top: 80px;
}
.fn:first-child { border-top: none; }
.fn:hover { background: var(--panel-2); }
.fn:target { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.fn.flash { animation: flash-row 1.8s ease-out; }
section.per.flash { animation: flash-sec 1.8s ease-out; }
@keyframes flash-row { 0%, 35% { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); } }
@keyframes flash-sec { 0%, 35% { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); } }
.fn .sig code { background: none; padding: 0; font-weight: 500; word-break: break-word; }
.fn .fname { color: var(--accent); font-weight: 700; }
.fn .opt { color: var(--muted); }
.fn .ret { display: block; color: var(--muted); font-family: "Cascadia Mono", "Consolas", monospace; font-size: 12.5px; }
.fn .anchor { position: absolute; left: 4px; top: 11px; font-size: 12px; color: var(--muted); opacity: 0; }
.fn:hover .anchor, .fn .anchor:focus { opacity: 1; text-decoration: none; }
.tick {
  display: inline-block; font-size: 11px; line-height: 1.6; color: var(--info); background: var(--info-bg);
  border-radius: 4px; padding: 0 6px; margin-left: 6px; white-space: nowrap; vertical-align: 1px; cursor: help;
}
.legend .tick { margin-left: 0; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 12px; border-top: 1px solid var(--line); vertical-align: top; }
tr:first-child th { border-top: none; }
th { color: var(--muted); font-weight: 600; font-size: 12.5px; background: var(--panel-2); }
td:first-child { white-space: nowrap; }
td code { font-size: 13px; }

.code { position: relative; }
.copy {
  position: absolute; top: 8px; right: 8px; font-size: 12px; padding: 2px 10px; cursor: pointer;
  border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); color: var(--muted);
}
.copy:hover { color: var(--accent); border-color: var(--accent); }
pre .k { color: var(--syn-kw); font-weight: 600; }
pre .s { color: var(--syn-str); }
pre .n { color: var(--syn-num); }
pre .c { color: var(--syn-com); font-style: italic; }
pre .f { color: var(--syn-fn); }

.cfg { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; }
.cfg div { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 5px 10px; background: var(--code-bg); border-radius: 7px; font-size: 13px; }
.cfg code { background: none; padding: 0; font-size: 13px; }
.cfg span { color: var(--muted); white-space: nowrap; }
.cfg-note { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
.files { list-style: none; margin: 0; padding: 0; }
.files li { margin: 3px 0; }

#empty { color: var(--muted); padding: 40px 0; text-align: center; }
.totop {
  position: fixed; right: 20px; bottom: 20px; z-index: 25; width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--line-strong); background: var(--panel); color: var(--text); box-shadow: var(--shadow);
  cursor: pointer; font-size: 18px; opacity: 0; pointer-events: none; transition: opacity .2s;
}
.totop.show { opacity: 1; pointer-events: auto; }
.totop:hover { color: var(--accent); border-color: var(--accent); }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 8px); z-index: 50; padding: 6px 14px; border-radius: 8px;
  background: var(--text); color: var(--bg); font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  aside {
    position: fixed; z-index: 40; left: 0; top: 0; width: min(300px, 86vw);
    transform: translateX(-100%); transition: transform .2s ease; box-shadow: 0 0 30px rgba(0, 0, 0, .25);
  }
  body.nav-open aside { transform: none; }
  .backdrop {
    display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .35);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  body.nav-open .backdrop { opacity: 1; pointer-events: auto; }
  .topbar .menu { display: inline-flex; }
  .topbar { padding: 8px 16px; gap: 8px; }
  .searchbox kbd, .count { display: none; }
  .page { padding: 22px 16px 80px; }
  h1 { font-size: 24px; }
  .per-head { padding: 16px 16px 14px; }
  .per-body { padding: 2px 16px 18px; }
  .fn { grid-template-columns: 1fr; padding: 10px 14px; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .totop { right: 14px; bottom: 14px; }
}
</style>
</head>
<body>
<div class="layout">
  <aside id="side">
    <a class="brand" href="#top">Ash<span>CC</span> <em>Lua API</em></a>
    <p class="sub">CC: Tweaked 周辺機器リファレンス<br>MC 1.21.1 / NeoForge · v0.1.0</p>
    <nav id="nav"></nav>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main id="top">
    <header class="topbar">
      <button class="iconbtn menu" id="menuBtn" type="button" aria-label="目次を開く">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="searchbox">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="関数・項目を検索（例: aimAt, heat）" autocomplete="off" aria-label="検索">
        <kbd>/</kbd>
      </div>
      <span id="count" class="count"></span>
      <span class="spacer"></span>
      <button class="iconbtn" id="themeBtn" type="button" title="表示テーマを切り替え">自動</button>
    </header>
    <div class="page">
      <div id="intro">
        <h1>AshCC Lua API</h1>
        <p class="lead">各周辺機器は <code>peripheral.find("型")</code> / <code>peripheral.wrap("名前")</code> で取得します。リンクハブ経由でも同じ API が使えます。</p>
        <div class="legend">
          <span><span class="tick">1 tick</span> サーバーのメインスレッドで実行（呼ぶと 1 tick 待つ）</span>
          <span><span class="badge req">要 …</span> 必要な MOD</span>
          <span><kbd class="mono">/</kbd> で検索、<kbd class="mono">Esc</kbd> で解除</span>
        </div>
        <div id="overview"></div>
      </div>
      <div id="content"></div>
      <p id="empty" class="hidden">一致する項目がありません。</p>
    </div>
  </main>
</div>
<button id="toTop" class="totop" type="button" aria-label="ページの先頭へ">↑</button>
<div id="toast" class="toast" role="status"></div>

<script>
// 各周辺機器の API。src/main/java/com/ashcc/**/*Peripheral.java と README.md から作成。
// fn: [シグネチャ, 戻り値, 説明, mainThread?]
const DATA = [
{
  id: "common", group: "はじめに", title: "座標と単位", type: null,
  intro: [
    "位置はワールド座標。エンティティは当たり判定の中心、Sable の Sub-Level（機体）は重心",
    "速度はブロック/秒。力は「質量×ブロック/秒²」（Sable の重力 ≈ 9.8 ブロック/秒²）",
    "角度はすべて度。機体ID は CC: Sable の <code>sublevel</code> API と同じ UUID 文字列",
    "Sable・Create・Create Aeronautics（Simulated）は任意依存。無い場合、該当機能は空の結果を返すかブロック自体が登録されない",
    "サーバー設定は <code>serverconfig/ashcc-server.toml</code>（各周辺機器の「設定」を参照）"
  ]
},
{
  id: "radar", group: "センサー", title: "レーダー", type: "radar", block: "ashcc:radar",
  intro: [
    "エンティティ（プレイヤー・モブ・アイテム・Create のコントラプション等）と Sable の機体を検知",
    "機体に載せても動く。座標はワールド座標で返し、方位・仰角は機体の向きに合わせて回る",
    "設置時にプレイヤーが向いていた方向が「前」。<code>local</code> 座標は x=右, y=上, z=前",
    "<code>azimuth</code> は方位角（前=0、右が正）、<code>elevation</code> は仰角（上が正）",
    "<code>distance</code> は Sub-Level なら外接箱の最も近い点まで（中心までは <code>centerDistance</code>）"
  ],
  fns: [
    ["getRange()", "number", "探知半径（既定 2048、上限なし）", true],
    ["setRange(r)", "number", "探知半径を設定。設定後の値を返す", true],
    ["hasSable()", "boolean", "Sable 連携が有効か"],
    ["getPosition()", "table", "レーダーのワールド座標 <code>{x,y,z}</code>。機体上なら <code>subLevel</code>（機体ID）付き", true],
    ["getOrientation()", "table", "<code>right / up / forward</code> のワールド方向ベクトル", true],
    ["toLocal(x, y, z)", "table", "ワールド座標 → レーダー座標", true],
    ["toWorld(x, y, z)", "table", "レーダー座標 → ワールド座標", true],
    ["getSelf()", "table | nil", "載っている機体の情報（Sub-Level の表、自機の <code>iff</code> 付き）。地上なら nil", true],
    ["scan([range])", "table", "<code>{ entities = {...}, subLevels = {...} }</code>（どちらも距離順）", true],
    ["scanEntities([range], [filter])", "table[]", "エンティティのみ。filter = <code>{ type = \"minecraft:zombie\" または {...}, player = bool, living = bool, name = \"部分一致\" }</code>", true],
    ["scanPlayers([range])", "table[]", "プレイヤーのみ", true],
    ["scanSubLevels([range])", "table[]", "機体のみ（自分が載っている機体は除外）。チャフのエコーも機体と同じ形で混ざる", true],
    ["scanTerrain([range], [size], [northUp])", "table", "周りの地形の高さ地図。size×size マス（既定 32、上限 terrainMaxSize=128）。行1=前方の端（画面の上）、列1=左端。レーダーの水平の向きに合わせて回る（northUp=true で北が上）。読み込まれていないチャンクは読み込まない（そのマスは nil、kind=\"unloaded\"）", true],
    ["getContact(id)", "table | nil", "1件を再取得（追跡用）。範囲外・消滅で nil", true],
    ["intercept(id, speed, [gravity])", "table | nil", "等速で動く目標への見越し射撃解 <code>{x,y,z, time, direction, local, azimuth, elevation, yaw, pitch}</code>。届かなければ nil", true],
    ["setWatch(enabled, [opts])", "table", "監視モード。opts = <code>{ interval = tick, entities = bool, subLevels = bool, filter = {...} }</code>。設定はブロックに保存され、チャンク再読み込み後も続く", true],
    ["getWatch()", "table", "現在の監視設定", true]
  ],

  config: "laserCannon: maxLenses (8), baseRange (96), rangePerLens (48), baseBlockPower (1.5), blockPowerPerLens (1.0), baseEntityDamage (6), entityDamagePerLens (2), igniteSeconds (5), breakBlocks (true), dropBlocks (false), damageOwnSubLevel (false), impactForce (300), recoil (true), energyPerTick (400), energyCapacity (200000), maxReceive (10000), maxFireSeconds (10), cooldownSeconds (5)"
}
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const stripTags = s => String(s).replace(/<[^>]+>/g, "");
const MT_TITLE = "サーバーのメインスレッドで実行（呼ぶと 1 tick 待つ）";

// シグネチャ: 関数名を強調し、[省略可] を薄くする
function sigHtml(sig) {
  return esc(sig)
    .replace(/([A-Za-z_]\w*)(?=\()/g, '<span class="fname">$1</span>')
    .replace(/\[([^\[\]]*)\]/g, '<span class="opt">[$1]</span>');
}

// 例のコード用の簡単な Lua 色付け
const LUA_KW = /^(?:and|break|do|else|elseif|end|false|for|function|goto|if|in|local|nil|not|or|repeat|return|then|true|until|while)$/;
function luaHtml(src) {
  const re = /(--[^\n]*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const t = m[0];
    if (m[1]) out += `<span class="c">${esc(t)}</span>`;
    else if (m[2]) out += `<span class="s">${esc(t)}</span>`;
    else if (m[3]) out += `<span class="n">${t}</span>`;
    else if (LUA_KW.test(t)) out += `<span class="k">${t}</span>`;
    else if (src[re.lastIndex] === "(") out += `<span class="f">${t}</span>`;
    else out += t;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

// "名前 (既定値), ..." を [名前, 既定値] の列にする。先頭の "〇〇: " は注記
function parseConfig(s) {
  let note = "";
  const pre = s.match(/^([^:()]+):\s*(.*)$/);
  if (pre) { note = pre[1]; s = pre[2]; }
  const items = [];
  let depth = 0, cur = "";
  for (const ch of s) {
    if (ch === "(") depth++;
    if (ch === ")") depth--;
    if (ch === "," && depth === 0) { items.push(cur.trim()); cur = ""; } else cur += ch;
  }
  if (cur.trim()) items.push(cur.trim());
  return { note, items: items.map(it => { const k = it.match(/^(\w+)\s*\((.*)\)$/); return k ? [k[1], k[2]] : [it, ""]; }) };
}

function badgesHtml(p, withBlock) {
  let s = "";
  if (p.type) s += `<span class="badge">型 ${esc(p.type)}</span>`;
  if (withBlock && p.block) s += `<span class="badge id">${esc(p.block)}</span>`;
  for (const r of p.req || []) s += `<span class="badge req">要 ${esc(r)}</span>`;
  return s ? `<div class="badges">${s}</div>` : "";
}

function renderSection(p) {
  const parts = [];
  let body = "";
  if (p.intro) body += `<ul class="notes">${p.intro.map(t => `<li>${t}</li>`).join("")}</ul>`;
  if (p.fns) {
    parts.push(["fns", "関数"]);
    body += `<h3 id="${p.id}--fns">関数 <span class="n">${p.fns.length}</span></h3><div class="fns">`;
    const used = new Set();
    for (const [sig, ret, desc, mt] of p.fns) {
      let fid = `${p.id}-${(sig.match(/[A-Za-z_]\w*/) || ["fn"])[0]}`;
      for (let i = 2; used.has(fid); i++) fid = fid.replace(/(-\d+)?$/, `-${i}`);
      used.add(fid);
      const retHtml = ret === "—" ? "戻り値なし" : `→ ${esc(ret)}`;
      body += `<div class="fn" id="${fid}" data-search="${esc(stripTags(sig + " " + ret + " " + desc).toLowerCase())}">
        <a class="anchor" href="#${fid}" aria-label="この関数へのリンク">#</a>
        <div class="sig"><code>${sigHtml(sig)}</code><span class="ret">${retHtml}</span></div>
        <div class="desc">${desc}${mt ? `<span class="tick" title="${MT_TITLE}">1 tick</span>` : ""}</div></div>`;
    }
    body += `</div>`;
  }
  (p.tables || []).forEach((t, i) => {
    if (i === 0) parts.push([`tbl`, "表"]);
    body += `<h3${i === 0 ? ` id="${p.id}--tbl"` : ""}>${esc(t.title)}</h3><div class="tablewrap"><table><tr><th>項目</th><th>内容</th></tr>`;
    body += t.rows.map(([k, v]) => `<tr><td><code>${esc(k)}</code></td><td>${v}</td></tr>`).join("");
    body += `</table></div>`;
  });
  if (p.events) {
    parts.push(["ev", "イベント"]);
    body += `<h3 id="${p.id}--ev">イベント</h3><div class="tablewrap"><table><tr><th>名前</th><th>引数</th><th>いつ</th></tr>`;
    body += p.events.map(([n, a, w]) => `<tr><td><code>${esc(n)}</code></td><td>${esc(a)}</td><td>${esc(w)}</td></tr>`).join("");
    body += `</table></div>`;
  }
  if (p.example) {
    parts.push(["ex", "例"]);
    body += `<h3 id="${p.id}--ex">例</h3><div class="code"><button class="copy" type="button" data-copy-pre>コピー</button><pre><code>${luaHtml(p.example)}</code></pre></div>`;
  }
  if (p.config) {
    parts.push(["cfg", "設定"]);
    const c = parseConfig(p.config);
    body += `<h3 id="${p.id}--cfg">設定 <span class="n">ashcc-server.toml</span></h3>`;
    if (c.note) body += `<p class="cfg-note">${esc(c.note)}</p>`;
    body += `<div class="cfg">${c.items.map(([k, v]) => `<div><code>${esc(k)}</code><span>${esc(v)}</span></div>`).join("")}</div>`;
  }
  if (p.files) {
    parts.push(["files", "関連プログラム"]);
    body += `<h3 id="${p.id}--files">関連プログラム</h3><ul class="files">${p.files.map(f => {
      const [path, ...rest] = f.split(" — ");
      return `<li><code>${esc(path)}</code>${rest.length ? ` — ${esc(rest.join(" — "))}` : ""}</li>`;
    }).join("")}</ul>`;
  }

  let head = `<div class="eyebrow">${esc(p.group)}</div><h2><a href="#${p.id}">${esc(p.title)}</a></h2>${badgesHtml(p, true)}`;
  const snippet = p.type && `local ${p.type.toLowerCase().replace(/^create_/, "")} = peripheral.find("${p.type}")`;
  if (snippet || parts.length > 1) {
    head += `<div class="head-row">`;
    if (snippet) head += `<button class="snippet" type="button" data-copy="${esc(snippet)}" title="クリックでコピー"><code>${luaHtml(snippet)}</code><span class="hint">コピー</span></button>`;
    if (parts.length > 1) head += `<div class="subnav">${parts.map(([k, l]) => `<a href="#${p.id}--${k}">${l}</a>`).join("")}</div>`;
    head += `</div>`;
  }
  return `<section class="per" id="${p.id}"><header class="per-head">${head}</header><div class="per-body">${body}</div></section>`;
}

function render() {
  let navHtml = "", ovHtml = "", lastGroup = null;
  for (const p of DATA) {
    if (p.group !== lastGroup) {
      navHtml += `<div class="group">${esc(p.group)}</div>`;
      ovHtml += `${lastGroup === null ? "" : "</div></div>"}<div class="ov-group"><h2>${esc(p.group)}</h2><div class="cards">`;
      lastGroup = p.group;
    }
    navHtml += `<a href="#${p.id}" data-for="${p.id}"><span>${esc(p.title)}</span>${p.type ? `<small>${esc(p.type)}</small>` : ""}</a>`;
    ovHtml += `<a class="card" href="#${p.id}"><span class="t">${esc(p.title)}</span>
      <span class="m"><code>${esc(p.type || (p.id === "imu_api" ? "imu（グローバル）" : "概要"))}</code><span>${p.fns ? `${p.fns.length} 関数` : ""}</span></span>
      ${(p.req || []).length ? `<div class="badges">${p.req.map(r => `<span class="badge req">要 ${esc(r)}</span>`).join("")}</div>` : ""}</a>`;
  }
  document.getElementById("nav").innerHTML = navHtml;
  document.getElementById("overview").innerHTML = ovHtml + "</div></div>";
  document.getElementById("content").innerHTML = DATA.map(renderSection).join("");
}

// 一致した文字を <mark> で囲む（ボタン・隠れた行は除く）
function highlight(root, q) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest("button, .hidden") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const t = n.nodeValue, lower = t.toLowerCase();
    let i = lower.indexOf(q);
    if (i < 0) continue;
    const frag = document.createDocumentFragment();
    let last = 0;
    while (i >= 0) {
      frag.append(t.slice(last, i));
      const m = document.createElement("mark");
      m.textContent = t.slice(i, i + q.length);
      frag.append(m);
      last = i + q.length;
      i = lower.indexOf(q, last);
    }
    frag.append(t.slice(last));
    n.replaceWith(frag);
  }
}

const originals = new Map();
function filter(raw) {
  const q = raw.trim().toLowerCase();
  let shown = 0, fnHits = 0;
  for (const sec of document.querySelectorAll("section.per")) {
    if (!originals.has(sec)) originals.set(sec, sec.innerHTML);
    sec.innerHTML = originals.get(sec);
    const rows = sec.querySelectorAll(".fn");
    let hit = 0;
    for (const r of rows) {
      const ok = !q || r.dataset.search.includes(q);
      r.classList.toggle("hidden", !ok);
      if (ok) hit++;
    }
    const textHit = q && sec.textContent.toLowerCase().includes(q);
    const show = !q || hit > 0 || textHit;
    // 関数が一致しなくても本文が一致した節は全関数を見せる
    if (q && hit === 0 && textHit) rows.forEach(r => r.classList.remove("hidden"));
    sec.classList.toggle("hidden", !show);
    document.querySelector(`nav a[data-for="${sec.id}"]`).classList.toggle("hidden", !show);
    if (show) { shown++; if (q) fnHits += hit; }
    if (q && show) highlight(sec, q);
  }
  document.getElementById("intro").classList.toggle("hidden", !!q);
  document.getElementById("empty").classList.toggle("hidden", shown > 0);
  document.getElementById("count").textContent = q ? `${shown} 件 · 一致した関数 ${fnHits}` : "";
  nav.querySelectorAll(".group").forEach(g => {
    let a = g.nextElementSibling, any = false;
    for (; a && a.tagName === "A"; a = a.nextElementSibling) if (!a.classList.contains("hidden")) any = true;
    g.classList.toggle("hidden", !any);
  });
  updateActive();
}

// 目次: いま読んでいる節を強調
function updateActive() {
  let cur = null;
  for (const sec of document.querySelectorAll("section.per:not(.hidden)")) {
    if (sec.getBoundingClientRect().top <= 120) cur = sec.id; else break;
  }
  for (const a of nav.querySelectorAll("a")) {
    const on = a.dataset.for === cur;
    if (on && !a.classList.contains("active")) {
      const r = a.getBoundingClientRect(), s = side.getBoundingClientRect();
      if (r.top < s.top + 60 || r.bottom > s.bottom - 20) side.scrollTop += r.top - s.top - s.height / 3;
    }
    a.classList.toggle("active", on);
  }
  toTop.classList.toggle("show", scrollY > 600);
}

// ページ内リンクは JS でスクロールする（data: URL や埋め込み表示では # の移動が効かないことがある）
function jumpTo(id, push = true) {
  if (id === "top" || !id) {
    scrollTo({ top: 0, behavior: "smooth" });
  } else {
    let el = document.getElementById(id);
    if (!el) return;
    if (el.closest(".hidden")) { search.value = ""; filter(""); el = document.getElementById(id); }
    el.scrollIntoView({ behavior: "smooth", block: "start" });
    const target = el.matches(".fn, section.per") ? el : null;
    if (target) {
      target.classList.remove("flash");
      void target.offsetWidth;
      target.classList.add("flash");
    }
  }
  if (push) try { history.pushState(null, "", "#" + id); } catch (e) {}
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
}
async function copyText(text, label) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.append(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e2) {}
    ta.remove();
  }
  toast(label);
}

function setupTheme() {
  const btn = document.getElementById("themeBtn");
  const order = ["auto", "light", "dark"], label = { auto: "自動", light: "ライト", dark: "ダーク" };
  let mode = "auto";
  try { mode = localStorage.getItem("ashcc-theme") || "auto"; } catch (e) {}
  const apply = () => {
    if (mode === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
    btn.textContent = label[mode];
  };
  btn.addEventListener("click", () => {
    mode = order[(order.indexOf(mode) + 1) % order.length];
    try { localStorage.setItem("ashcc-theme", mode); } catch (e) {}
    apply();
  });
  apply();
}

render();
setupTheme();
const nav = document.getElementById("nav"), side = document.getElementById("side");
const search = document.getElementById("search"), toTop = document.getElementById("toTop");
const setNav = open => document.body.classList.toggle("nav-open", open);

search.addEventListener("input", e => filter(e.target.value));
search.addEventListener("keydown", e => { if (e.key === "Escape") { search.value = ""; filter(""); search.blur(); } });
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if ((e.key === "/" && !typing) || (e.key.toLowerCase() === "k" && (e.ctrlKey || e.metaKey))) {
    e.preventDefault();
    search.focus();
    search.select();
  } else if (e.key === "Escape") setNav(false);
});
document.getElementById("menuBtn").addEventListener("click", () => setNav(!document.body.classList.contains("nav-open")));
document.getElementById("backdrop").addEventListener("click", () => setNav(false));
nav.addEventListener("click", e => { if (e.target.closest("a")) setNav(false); });
toTop.addEventListener("click", () => scrollTo({ top: 0 }));
document.addEventListener("click", e => {
  const link = e.target.closest('a[href^="#"]');
  if (link && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
    e.preventDefault();
    return jumpTo(decodeURIComponent(link.getAttribute("href").slice(1)));
  }
  const snip = e.target.closest("[data-copy]");
  if (snip) return copyText(snip.dataset.copy, "コピーしました");
  const btn = e.target.closest("[data-copy-pre]");
  if (btn) copyText(btn.parentElement.querySelector("pre").textContent, "例をコピーしました");
});
let ticking = false;
addEventListener("scroll", () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => { updateActive(); ticking = false; });
}, { passive: true });
addEventListener("popstate", () => jumpTo(decodeURIComponent(location.hash.slice(1)) || "top", false));
if (location.hash.length > 1) jumpTo(decodeURIComponent(location.hash.slice(1)), false);
updateActive();
</script>
